name: E2E staging

# Corre los 15 flujos contra la dirección de staging. No usa AWS: solo la dirección pública y dos
# cuentas de pruebas (distintas de las de las personas que prueban a mano). Variables y secretos del
# entorno `staging` de GitHub: E2E_BASE_URL (variable) y E2E_OWNER_EMAIL, E2E_OWNER_PASSWORD,
# E2E_OTHER_EMAIL, E2E_OTHER_PASSWORD (secretos). Ver docs/manual-despliegue.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    environment: staging
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
      E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
      E2E_OTHER_EMAIL: ${{ secrets.E2E_OTHER_EMAIL }}
      E2E_OTHER_PASSWORD: ${{ secrets.E2E_OTHER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Los 15 flujos contra staging
        run: npx playwright test --config apps/web/playwright.staging.config.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: trazas-e2e-staging
          path: apps/web/test-results
          retention-days: 7
