<title>Manual de usuario POS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap">
<style>
  /* Manual en una sola columna de lectura; en pantallas anchas el índice queda fijo a la izquierda. */
  :root {
    --bg: #f3f5fb;
    --surface: #ffffff;
    --fg: #1b243b;
    --muted: #5b6578;
    --accent: #1e3fd0;
    --accent-soft: #eef2ff;
    --line: #d5dbea;
    --note: #e3e9fb;
    --shadow: 0 1px 2px rgba(27, 36, 59, 0.08), 0 8px 24px rgba(27, 36, 59, 0.1);
    --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1424;
      --surface: #171e33;
      --fg: #e6eaf5;
      --muted: #a2abc2;
      --accent: #8fa4ff;
      --accent-soft: #1d2748;
      --line: #2c3556;
      --note: #1d2748;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1424;
    --surface: #171e33;
    --fg: #e6eaf5;
    --muted: #a2abc2;
    --accent: #8fa4ff;
    --accent-soft: #1d2748;
    --line: #2c3556;
    --note: #1d2748;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.6;
    padding-block: 8px 64px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .layout { max-width: 1080px; margin: 0 auto; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 960px) {
    .layout { grid-template-columns: 260px minmax(0, 1fr); gap: 48px; }
    nav#TOC { position: sticky; top: 16px; align-self: start; max-height: calc(100vh - 32px); overflow-y: auto; }
    nav#TOC details { border: 0; background: none; padding: 0; }
    nav#TOC summary { display: none; }
  }
  header.portada { padding: 40px 0 8px; max-width: 760px; margin: 0 auto; grid-column: 1 / -1; width: 100%; }
  header.portada h1 { font-size: clamp(2rem, 6vw, 3rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; margin: 0 0 12px; color: var(--accent); text-wrap: balance; }
  header.portada p { margin: 0; color: var(--muted); font-size: 1.05rem; max-width: 52ch; }
  nav#TOC details { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 16px; }
  nav#TOC summary { cursor: pointer; font-weight: 700; padding: 12px 0; }
  nav#TOC ul { list-style: none; margin: 0; padding: 0; }
  nav#TOC ul ul { padding-left: 14px; border-left: 1px solid var(--line); margin: 2px 0 8px 4px; }
  nav#TOC a { display: block; padding: 5px 0; color: var(--fg); text-decoration: none; font-size: 0.94rem; }
  nav#TOC > details > ul > li > a { font-weight: 700; margin-top: 6px; }
  nav#TOC a:hover { color: var(--accent); }
  main { max-width: 760px; width: 100%; min-width: 0; }
  main section { margin: 0; }
  main h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.02em; margin: 56px 0 8px; color: var(--accent); text-wrap: balance; scroll-margin-top: 16px; }
  main h2 { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.015em; margin: 40px 0 8px; text-wrap: balance; scroll-margin-top: 16px; }
  main h3 { font-size: 1.1rem; font-weight: 700; margin: 28px 0 6px; scroll-margin-top: 16px; }
  main p, main li { max-width: 68ch; }
  main li { margin: 6px 0; }
  main a { color: var(--accent); }
  strong { font-weight: 700; }
  figure { margin: 16px 0 24px; padding: 0; }
  li figure { margin-left: 0; }
  figure img { display: block; width: 100%; max-width: 320px; height: auto; margin: 0 auto; border-radius: 16px; border: 1px solid var(--line); box-shadow: var(--shadow); background: var(--surface); }
  figcaption { max-width: 320px; margin: 8px auto 0; font-size: 0.82rem; color: var(--muted); text-align: center; line-height: 1.4; }
  blockquote { margin: 20px 0; padding: 12px 16px; background: var(--note); border-left: 4px solid var(--accent); border-radius: 0 10px 10px 0; }
  blockquote p { margin: 6px 0; }
  .tabla { overflow-x: auto; margin: 16px 0; }
  table { border-collapse: collapse; width: 100%; min-width: 440px; font-size: 0.94rem; background: var(--surface); }
  th, td { border: 1px solid var(--line); padding: 8px 12px; text-align: left; vertical-align: top; }
  th { background: var(--accent-soft); }
  hr { display: none; }
  a:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  @media print { nav#TOC { display: none; } }
</style>
<div class="layout">
  <header class="portada">
    <h1>$title$</h1>
    <p>$subtitle$</p>
  </header>
  <nav id="TOC" aria-label="Contenido">
    <details open>
      <summary>Contenido</summary>
      $toc$
    </details>
  </nav>
  <main>
    $body$
  </main>
</div>
<script>
  // En el teléfono el índice empieza plegado para que el manual abra directo en el texto.
  if (window.matchMedia && window.matchMedia("(max-width: 959px)").matches) {
    var indice = document.querySelector("nav#TOC details");
    if (indice) indice.removeAttribute("open");
  }
  // Las tablas anchas se desplazan dentro de su propio recuadro, no la página.
  document.querySelectorAll("main table").forEach(function (tabla) {
    var envoltura = document.createElement("div");
    envoltura.className = "tabla";
    tabla.parentNode.insertBefore(envoltura, tabla);
    envoltura.appendChild(tabla);
  });
</script>
