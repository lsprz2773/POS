# Solo para desarrollo local. No se usa en producción.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pos
      # Solo desarrollo: sin contraseña y accesible únicamente desde esta máquina (127.0.0.1).
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: pos
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pos-db:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pos -d pos']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pos-db:
