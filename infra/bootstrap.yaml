AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Arranque único del POS ligero para cuentas de la nueva experiencia de AWS: bucket de artefactos de
  despliegue y presupuestos con alertas. No crea acceso de GitHub (la política de servicio de la
  cuenta prohíbe el proveedor OIDC): se despliega desde CloudShell. Ver docs/manual-despliegue.md.

Parameters:
  AlertEmail:
    Type: String
    Description: Correo que recibe las alertas de presupuesto.
  MonthlyLimitUsd:
    Type: Number
    Default: 1
    Description: Tope de gasto mensual aceptado, en dólares.

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub pos-deploy-artifacts-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: BorrarArtefactosViejos
            Status: Enabled
            ExpirationInDays: 30

  # ---------- Presupuesto ----------
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: pos-mensual
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyLimitUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]

  # Aviso temprano: cualquier cobro, por pequeño que sea (el plan gratuito debería dar $0).
  FirstCentBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: pos-primer-centavo
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 0.01
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]

Outputs:
  ArtifactBucketName:
    Description: Valor de ARTIFACT_BUCKET al desplegar desde CloudShell.
    Value: !Ref ArtifactBucket
