AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: POS ligero, un entorno completo (web en CloudFront + S3, API en Lambda, Cognito). Ver docs/despliegue.md.

# Un stack por entorno: `pos-staging` y `pos-prod`. Todo dentro de la capa gratuita (docs/despliegue.md).
# Requiere antes: el parámetro de la base de datos en Parameter Store y la plantilla infra/bootstrap.yaml.

Parameters:
  Environment:
    Type: String
    AllowedValues: [staging, prod]
  AppOrigin:
    Type: String
    Default: 'https://pending.invalid'
    Description: >-
      Dirección pública de la web (https://xxxx.cloudfront.net). Es el único origen que puede enviar
      escrituras. En el primer despliegue no existe todavía; infra/deploy.sh la completa en un segundo paso.
  AlertEmail:
    Type: String
    Description: Correo que recibe las alarmas.
  DatabaseUrlParam:
    Type: String
    Description: Nombre del parámetro SecureString con la cadena de conexión de Neon, p. ej. /pos/staging/database-url.

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    Timeout: 15
    MemorySize: 512

Resources:
  # ---------- Identidad ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub pos-${Environment}
      UserPoolTier: ESSENTIALS
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      DeletionProtection: !If [IsProd, ACTIVE, INACTIVE]
      MfaConfiguration: 'OFF'
      # Sin registro público: las cuentas las crea el propietario (docs/manual-despliegue.md).
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 3
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub pos-${Environment}-web
      GenerateSecret: false
      # La API intercambia las credenciales en el servidor; el navegador nunca habla con Cognito.
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      AccessTokenValidity: 15
      IdTokenValidity: 15
      # Debe coincidir con REFRESH_TTL_SECONDS (7 días) de la Lambda.
      RefreshTokenValidity: 7

  # ---------- API ----------
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/pos-${Environment}-api
      RetentionInDays: 14

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # Límite de ritmo: acota costo y conexiones a la base ante un abuso o un error.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub pos-${Environment}-api
      Description: API del POS (Fastify detrás de un adaptador)
      CodeUri: ../apps/api/dist-lambda/
      Handler: index.handler
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Environment:
        Variables:
          NODE_ENV: production
          APP_ORIGIN: !Ref AppOrigin
          AUTH_PROVIDER: cognito
          COGNITO_REGION: !Ref AWS::Region
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient
          REFRESH_TTL_SECONDS: '604800'
          DATABASE_URL_PARAM: !Ref DatabaseUrlParam
          LOG_LEVEL: info
      Policies:
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabaseUrlParam}
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/{proxy+}
            Method: ANY

  # ---------- Web ----------
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  WebAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub pos-${Environment}-web
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Las rutas de la web (/vender, /pendientes…) no son archivos: se sirve index.html. Solo se aplica a
  # la web; /api/* no pasa por aquí, así que un 404 de la API sigue siendo un 404 en JSON.
  SpaRewrite:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub pos-${Environment}-spa-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Rutas de la SPA a index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri.indexOf('.') === -1) request.uri = '/index.html';
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub pos-${Environment}
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: api
            DomainName: !Sub ${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          # CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # SecurityHeadersPolicy (HSTS, nosniff, referrer, frame)
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewrite.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            # CachingDisabled
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # AllViewerExceptHostHeader: reenvía cookies, Origin y cadena de consulta
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Sid: SoloCloudFront
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  # ---------- Alarmas ----------
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub pos-${Environment}-alarmas
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub pos-${Environment}-errores-lambda
      AlarmDescription: La API lanzó errores no controlados varias veces seguidas.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub pos-${Environment}-5xx-api
      AlarmDescription: La API respondió errores 5xx varias veces seguidas.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  WebUrl:
    Description: Dirección pública de la aplicación (web y /api).
    Value: !Sub https://${Distribution.DomainName}
  DistributionId:
    Value: !Ref Distribution
  WebBucketName:
    Value: !Ref WebBucket
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  FunctionName:
    Value: !Ref ApiFunction
